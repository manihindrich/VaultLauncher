[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-launcher"
version = "0.1.0"
description = "Small launcher window for Obsidian vaults"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mani Hindrich", email = "mani@hindrich.cz" }]
dependencies = ["PySide6>=6.5"]

[project.urls]
Homepage = "https://github.com/manihindrich"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
vault-launcher = "vault_launcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
